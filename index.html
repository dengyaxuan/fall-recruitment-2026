<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招投递管理</title>
<script src="./tailwind.js"></script>
<script>
// Tailwind 运行时已本地化（cdn.tailwindcss.com 国内常抽风，会阻塞首屏）
// 本地文件缺失时（如双击打开本地 html）才回退 CDN
if (typeof tailwind === "undefined") {
  document.write('<scr' + 'ipt src="https://cdn.tailwindcss.com"><\/scr' + 'ipt>');
}
</script>
<style>
* { box-sizing: border-box; }
body { font-family: 'Microsoft YaHei','PingFang SC',system-ui,sans-serif; background:#f0f2f5; color:#1f2937; }
.nav-btn { transition: all .2s; }
.nav-btn.active { background:#4f46e5; color:#fff; box-shadow:0 2px 8px rgba(79,70,229,.3); }
.cat-tab { transition: all .15s; cursor:pointer; }
.cat-tab.active { background:#4f46e5; color:#fff; }
.job-card { transition: box-shadow .2s, transform .1s; }
.job-card:hover { box-shadow:0 4px 20px rgba(0,0,0,.1); }
.job-card .matched-pos { background:#eef2ff; border-left:3px solid #4f46e5; }
.badge { font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500; }
.drop-zone { border:2px dashed #c7d2fe; transition: all .2s; }
.drop-zone.dragover { border-color:#4f46e5; background:#eef2ff; }
.status-tab { cursor:pointer; transition: all .15s; }
.status-tab.active { border-bottom:3px solid #4f46e5; color:#4f46e5; font-weight:600; }
.modal-overlay { background:rgba(0,0,0,.5); }
#data-loading { background:#f0f2f5; }
.skeleton-card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; }
.sk-line { background:linear-gradient(90deg,#eef0f3 25%,#e3e6ea 37%,#eef0f3 63%); background-size:400% 100%; animation:sk 1.2s ease infinite; border-radius:6px; height:12px; margin-bottom:8px; }
@keyframes sk { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
.btn-action { font-size:12px; padding:5px 12px; border-radius:6px; transition: all .15s; cursor:pointer; }
.fade-in { animation: fadeIn .3s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#c1c5c9; border-radius:3px; }
.fav-star { animation: starPop .3s; }
@keyframes starPop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }
.company-block { background:#fff; border-radius:16px; border:1px solid #e5e7eb; padding:20px; }
.parent-block { background:#f8faff; border-radius:16px; border:1px solid #c7d2fe; overflow:hidden; }
.parent-header { padding:16px 20px; }
.parent-body { padding:0 20px 16px; }
.sub-block { background:#fff; border-radius:12px; border:1px solid #e5e7eb; margin-top:10px; overflow:hidden; }
.sub-header { padding:12px 16px; }
.sub-body { padding:8px 16px 12px; }
.collapse-header { cursor:pointer; user-select:none; transition: background .15s; }
.collapse-header:hover { background:rgba(99,102,241,.04); }
.collapse-icon { transition: transform .2s; display:inline-block; font-size:11px; color:#9ca3af; }
.collapse-header.collapsed .collapse-icon { transform: rotate(-90deg); }
</style>
</head>
<body>

<!-- 数据加载遮罩（外置 jobs.json 加载期间显示）-->
<div id="data-loading" class="fixed inset-0 z-[60] flex flex-col items-center justify-center px-6">
  <div class="w-full max-w-2xl">
    <div class="text-center mb-6">
      <div class="text-3xl mb-2">🎯</div>
      <div class="font-bold text-lg text-gray-800">秋招投递管理</div>
      <div class="text-sm text-gray-500 mt-1" id="data-loading-text">正在加载岗位数据…</div>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
      <div id="data-loading-bar" class="bg-indigo-600 h-1.5 rounded-full transition-all" style="width:8%"></div>
    </div>
    <div class="skeleton-card mt-6">
      <div class="sk-line" style="width:40%"></div>
      <div class="sk-line" style="width:90%"></div>
      <div class="sk-line" style="width:65%;margin-bottom:0"></div>
    </div>
    <div class="skeleton-card">
      <div class="sk-line" style="width:35%"></div>
      <div class="sk-line" style="width:80%"></div>
      <div class="sk-line" style="width:55%;margin-bottom:0"></div>
    </div>
  </div>
</div>

<!-- 顶部导航 -->
<nav class="sticky top-0 z-50 bg-white shadow-sm">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 h-14">
    <div class="flex items-center gap-2">
      <span class="text-xl">🎯</span>
      <span class="font-bold text-lg text-gray-800">秋招投递管理</span>
    </div>
    <div class="flex gap-1">
      <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600" data-section="deadline">⏰ 倒计时</button>
      <button class="nav-btn active px-4 py-2 rounded-lg text-sm font-medium text-gray-600" data-section="jobs">岗位推荐</button>
      <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600" data-section="fav">⭐ 心选公司</button>
      <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600" data-section="summary">投递汇总</button>
      <button class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-600" data-section="resume">简历管理</button>
    </div>
  </div>
</nav>

<!-- 同步状态栏 -->
<div id="sync-bar" class="bg-indigo-50 border-b border-indigo-100">
  <div class="max-w-7xl mx-auto flex items-center gap-3 px-4 py-1.5 text-sm flex-wrap">
    <span id="sync-status" class="text-gray-500">📁 本地模式</span>
    <span class="text-gray-300">|</span>
    <button onclick="exportData()" class="text-indigo-600 hover:underline text-xs">导出数据</button>
    <button onclick="importFromClipboard()" class="text-indigo-600 hover:underline text-xs">从剪贴板粘贴</button>
    <button onclick="document.getElementById('import-file').click()" class="text-indigo-600 hover:underline text-xs">导入文件</button>
    <input type="file" id="import-file" class="hidden" accept=".json">
    <span class="ml-auto text-xs text-gray-400 flex items-center gap-2" id="sync-info"></span>
  </div>
</div>

<main class="max-w-7xl mx-auto px-4 py-6">

<!-- ========== 倒计时 ========== -->
<section id="section-deadline" class="hidden">
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <input id="dl-search-input" type="text" placeholder="搜索公司名 / 岗位 / 城市…" class="flex-1 min-w-[200px] px-4 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-indigo-500">
    <select id="dl-filter-city" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部城市</option>
    </select>
    <select id="dl-filter-edu" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部学历</option>
    </select>
    <select id="dl-filter-type" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部类型</option>
    </select>
    <select id="dl-filter-ctype" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部企业类型</option>
    </select>
    <select id="dl-filter-deadline" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部截止时间</option>
      <option value="today">今天截止</option>
      <option value="3d">3天内截止</option>
      <option value="7d">7天内截止</option>
      <option value="21d">21天内截止</option>
      <option value="30d">30天内截止</option>
    </select>
    <label class="flex items-center gap-1 text-sm text-gray-500">
      <input type="checkbox" id="dl-filter-link" class="rounded"> 仅有链接
    </label>
    <span id="dl-result-count" class="text-sm text-gray-400 ml-auto"></span>
  </div>

  <div id="deadline-list" class="grid gap-3"></div>
  <div id="deadline-pagination" class="flex items-center justify-center gap-2 mt-6"></div>
</section>

<!-- ========== 岗位推荐 ========== -->
<section id="section-jobs">
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="cat-tab active px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="全部">全部 <span class="text-xs opacity-60" id="cnt-all"></span></div>
    <div class="cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="产品">产品 <span class="text-xs opacity-60" id="cnt-产品"></span></div>
    <div class="cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="数据分析">数据分析 <span class="text-xs opacity-60" id="cnt-数据分析"></span></div>
    <div class="cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="商业分析">商业分析 <span class="text-xs opacity-60" id="cnt-商业分析"></span></div>
    <div class="cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="国际化">国际化 <span class="text-xs opacity-60" id="cnt-国际化"></span></div>
    <div class="cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-cat="物流供应链">物流供应链 <span class="text-xs opacity-60" id="cnt-物流供应链"></span></div>

  </div>

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <input id="search-input" type="text" placeholder="搜索公司名 / 岗位 / 城市…" class="flex-1 min-w-[200px] px-4 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-indigo-500">
    <select id="filter-city" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部城市</option>
    </select>
    <select id="filter-edu" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部学历</option>
    </select>
    <select id="filter-type" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部类型</option>
    </select>
    <select id="filter-ctype" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部企业类型</option>
    </select>
    <select id="filter-date" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部更新时间</option>
    </select>
    <select id="filter-opened" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部开放时间</option>
      <option value="today">今天新开放</option>
      <option value="3d">3天内新开放</option>
      <option value="7d">7天内新开放</option>
      <option value="21d">21天内新开放</option>
      <option value="30d">30天内新开放</option>
    </select>
    <label class="flex items-center gap-1 text-sm text-gray-500">
      <input type="checkbox" id="filter-link" class="rounded"> 仅有链接
    </label>
    <span id="result-count" class="text-sm text-gray-400 ml-auto"></span>
  </div>

  <div id="job-list" class="grid gap-3"></div>
  <div id="pagination" class="flex items-center justify-center gap-2 mt-6"></div>
</section>

<!-- ========== 心选公司 ========== -->
<section id="section-fav" class="hidden">
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="fav-cat-tab cat-tab active px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="全部">全部 <span class="text-xs opacity-60" id="fcnt-全部"></span></div>
    <div class="fav-cat-tab cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="IT互联网">IT互联网 <span class="text-xs opacity-60" id="fcnt-IT互联网"></span></div>
    <div class="fav-cat-tab cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="外企">外企 <span class="text-xs opacity-60" id="fcnt-外企"></span></div>
    <div class="fav-cat-tab cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="制造业">制造业 <span class="text-xs opacity-60" id="fcnt-制造业"></span></div>
    <div class="fav-cat-tab cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="游戏">游戏 <span class="text-xs opacity-60" id="fcnt-游戏"></span></div>
    <div class="fav-cat-tab cat-tab px-3 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border" data-fcat="其他">其他 <span class="text-xs opacity-60" id="fcnt-其他"></span></div>
  </div>

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <input id="fav-search-input" type="text" placeholder="搜索公司名 / 岗位 / 城市…" class="flex-1 min-w-[200px] px-4 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:border-indigo-500">
    <select id="fav-filter-city" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部城市</option>
    </select>
    <select id="fav-filter-edu" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部学历</option>
    </select>
    <select id="fav-filter-type" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部类型</option>
    </select>
    <select id="fav-filter-date" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部更新时间</option>

      <option value="">全部收藏公司</option>

    </label>
    <span id="fav-count" class="text-sm text-gray-400 ml-auto"></span>
  </div>

  <div id="fav-list" class="grid gap-6"></div>
</section>

<!-- ========== 投递汇总 ========== -->
<section id="section-summary" class="hidden">
  <div class="flex gap-6 border-b mb-2">
    <div class="status-tab active pb-2 px-1 text-sm" data-status="wishlist">💛 心愿单 <span class="text-xs text-gray-400" id="sum-wishlist"></span></div>
    <div class="status-tab pb-2 px-1 text-sm" data-status="not_started">⏸ 未开始 <span class="text-xs text-gray-400" id="sum-not_started"></span></div>
    <div class="status-tab pb-2 px-1 text-sm" data-status="unsuitable">✗ 不合适 <span class="text-xs text-gray-400" id="sum-unsuitable"></span></div>
    <div class="status-tab pb-2 px-1 text-sm" data-status="applied">✓ 已投 <span class="text-xs text-gray-400" id="sum-applied"></span></div>
    <div class="status-tab pb-2 px-1 text-sm" data-status="in_progress">⏳ 投递中 <span class="text-xs text-gray-400" id="sum-in_progress"></span></div>
    <div class="status-tab pb-2 px-1 text-sm" data-status="ended">🏁 流程结束 <span class="text-xs text-gray-400" id="sum-ended"></span></div>
  </div>
  <div class="flex items-center gap-3 mb-4">
    <button id="sum-add-btn" class="hidden px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700" onclick="showAddForm()">＋ 新增岗位</button>
    <select id="sum-filter-date" class="px-3 py-2 rounded-lg border border-gray-300 text-sm bg-white">
      <option value="">全部更新时间</option>
    </select>
    <span id="sum-result-count" class="text-sm text-gray-400 ml-auto"></span>
  </div>
  <div id="summary-list" class="grid gap-3"></div>
</section>

<!-- ========== 简历管理 ========== -->
<section id="section-resume" class="hidden">
  <div class="drop-zone rounded-xl bg-white p-8 text-center mb-6" id="drop-zone">
    <div class="text-4xl mb-2">📄</div>
    <p class="text-gray-600 text-sm mb-3">拖拽简历文件到此处，或点击选择文件</p>
    <p class="text-gray-400 text-xs mb-3">支持 PDF / Word / 图片，可保存多个版本</p>
    <input type="file" id="file-input" class="hidden" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
    <button onclick="document.getElementById('file-input').click()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">选择文件</button>
  </div>
  <div id="resume-list" class="grid gap-3"></div>
</section>

</main>

<!-- 详情弹窗 -->
<div id="modal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto" id="modal-content"></div>
</div>

function fmtSyncTime(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function updateSyncUI() {
  const el = document.getElementById("sync-status");
  const info = document.getElementById("sync-info");
  if (!el) return;
  if (syncStatus === "syncing") { el.textContent = "🔄 同步中…"; el.className = "text-amber-600"; }
  else if (syncStatus === "synced") {
    el.textContent = lastSyncTime ? `☁️ 已同步 ${fmtSyncTime(lastSyncTime)}` : "☁️ 已云同步";
    el.className = "text-green-600";
  }
  else if (syncStatus === "error") { el.textContent = "⚠️ 云同步失败（仅本地）"; el.className = "text-red-500"; }
  else { el.textContent = "📁 本地模式"; el.className = "text-gray-500"; }
  if (info) {
    if (syncStatus === "error") {
      info.innerHTML = `<span class="text-gray-400 text-xs">数据未同步到云端，请使用下方导出/导入功能</span>`;
    } else if (syncStatus === "synced") {
      info.innerHTML = `<span class="text-gray-400 text-xs">Firebase 云同步 · 上次同步 ${lastSyncTime ? fmtSyncTime(lastSyncTime) : "—"}</span>`;
    } else {
      info.innerHTML = "";
    }
  }
}

async function cloudSave(retry = true) {
  const payload = JSON.stringify({ s: statuses, f: favCompanies, c: customJobs, t: Date.now() });
  try {
    syncStatus = "syncing"; updateSyncUI();
    const res = await fetch(FB_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: payload
    });
    if (!res.ok) throw new Error("save failed: " + res.status);
    const sent = JSON.parse(payload);
    localStorage.setItem("last_edit_t", String(sent.t));
    lastSyncTime = new Date();
    syncStatus = "synced"; updateSyncUI();
  } catch (e) {
    if (retry) {
      setTimeout(() => cloudSave(false), 1500);
      return;
    }
    syncStatus = "error"; updateSyncUI();
  }
}

async function cloudLoad() {
  try {
    syncStatus = "syncing"; updateSyncUI();
    const res = await fetch(FB_URL + `?t=${Date.now()}`);
    if (!res.ok) throw new Error("load failed: " + res.status);
    const data = await res.json();
    if (data && data.s) {
      const localT = getLocalEditTime();
      if ((data.t || 0) > localT) {
        // 云端更新，覆盖本地
        statuses = data.s;
        if (data.f) favCompanies = data.f;
        if (Array.isArray(data.c)) customJobs = data.c;
        localStorage.setItem("job_statuses", JSON.stringify(statuses));
        localStorage.setItem("fav_companies", JSON.stringify(favCompanies));
        localStorage.setItem("custom_jobs", JSON.stringify(customJobs));
        localStorage.setItem("last_edit_t", String(data.t || Date.now()));
        refreshAll();
      } else {
        // 本地更新，把本地推上云
        debouncedCloudSave();
      }
    } else {
      // 云端为空，上传本地
      cloudSave();
    }
    lastSyncTime = new Date();
    syncStatus = "synced"; updateSyncUI();
  } catch (e) {
    syncStatus = "error"; updateSyncUI();
  }
}

function debouncedCloudSave() {
  localStorage.setItem("last_edit_t", String(Date.now()));
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(cloudSave, 2000);
}

function exportData() {

  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = `秋招投递数据_${new Date().toLocaleDateString("zh-CN").replace(/\//g,"")}.json`;

  const code = btoa(unescape(encodeURIComponent(data)));

function getFilteredJobs() {
  const filtered = JOBS_DATA.filter(j => {
    if (HIDDEN_STATUSES.includes(statuses[j.id])) return false;
    if (state.cat !== "全部") {
      if (state.cat === "其他") { if (j.categories.length > 0) return false; }
      else { if (!j.categories.includes(state.cat)) return false; }
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = (j.company + " " + j.positionsText + " " + j.city + " " + j.industry).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.city && !j.city.includes(state.city)) return false;
    if (state.edu && !j.education.includes(state.edu)) return false;
    if (state.rtype && !j.recruitType.includes(state.rtype)) return false;
    if (state.ctype && !j.companyType.includes(state.ctype)) return false;
    if (state.updateDate && j.updateDate !== state.updateDate) return false;
    if (state.openedWithin) {
      const ago = daysSince(j.updateDate);   // 距今多少天前开放
      if (ago === null) return false;
      switch (state.openedWithin) {
        case "today": if (ago !== 0) return false; break;
        case "3d":   if (ago > 3) return false; break;
        case "7d":   if (ago > 7) return false; break;
        case "21d":  if (ago > 21) return false; break;
        case "30d":  if (ago > 30) return false; break;
      }
    }
    if (state.linkOnly && !j.applyLink) return false;
    return true;
  });
  return sortPhdLast(filtered);
}

// ── 懒加载控件（下滑自动加载 + 手动按钮兜底）──
let moreObserver = null;
function renderMoreControl(boxId, total, shown, fnName) {
  const box = document.getElementById(boxId);
  if (!box) return;
  if (moreObserver) { moreObserver.disconnect(); moreObserver = null; }
  if (!total) { box.innerHTML = ""; return; }
  if (shown >= total) {
    box.innerHTML = `<div class="text-center text-gray-400 text-sm py-4">— 已显示全部 ${total} 条 —</div>`;
    return;
  }
  box.innerHTML = `<div id="${boxId}-more" class="text-center py-4">
    <button class="px-5 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700" onclick="${fnName}()">加载更多</button>
    <div class="text-xs text-gray-400 mt-2">已显示 ${shown} / ${total} 条</div>
  </div>`;
  const target = document.getElementById(boxId + "-more");
  if (target && "IntersectionObserver" in window) {
    moreObserver = new IntersectionObserver(entries => {
      if (entries[0] && entries[0].isIntersecting) {
        if (moreObserver) { moreObserver.disconnect(); moreObserver = null; }
        window[fnName]();
      }
    }, { rootMargin: "700px" });
    moreObserver.observe(target);
  }
}

// ── 倒计时工具 ──
function parseDeadline(dl) {
  if (!dl || typeof dl !== "string") return null;
  const m = dl.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if (!m) return null;
  const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  if (isNaN(d.getTime())) return null;
  return d;
}
function daysUntil(dl) {
  const d = parseDeadline(dl);
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d.getTime() - now.getTime()) / 86400000);
}
// 距今多少天前开放招聘（负数=未来日期，按 0 处理）
function daysSince(ds) {
  const d = parseDeadline(ds);
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((now.getTime() - d.getTime()) / 86400000);
  return diff < 0 ? 0 : diff;
}
function deadlineLabel(dl) {
  const d = daysUntil(dl);
  if (d === null) return "";
  if (d < 0) return `<span class="badge bg-red-100 text-red-600">已过期 ${-d} 天</span>`;
  if (d === 0) return `<span class="badge bg-red-100 text-red-700">今天截止</span>`;
  if (d <= 3) return `<span class="badge bg-orange-100 text-orange-700">${d} 天后截止</span>`;
  if (d <= 7) return `<span class="badge bg-amber-100 text-amber-700">${d} 天后截止</span>`;
  if (d <= 30) return `<span class="badge bg-blue-100 text-blue-700">${d} 天后截止</span>`;
  return `<span class="badge bg-gray-100 text-gray-600">${d} 天后截止</span>`;
}

function getDeadlineJobs() {
  const now = new Date(); now.setHours(0,0,0,0);
  let jobs = JOBS_DATA.filter(j => {
    if (HIDDEN_STATUSES.includes(statuses[j.id])) return false;
    if (!j.deadline || !parseDeadline(j.deadline)) return false;
    // 过期岗位不显示：倒计时板块只提醒还未截止的岗位
    const dd = daysUntil(j.deadline);
    if (dd === null || dd < 0) return false;
    if (state.dlSearch) {
      const q = state.dlSearch.toLowerCase();
      const hay = (j.company + " " + j.positionsText + " " + j.city + " " + j.industry).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.dlCity && !j.city.includes(state.dlCity)) return false;
    if (state.dlEdu && !j.education.includes(state.dlEdu)) return false;
    if (state.dlType && !j.recruitType.includes(state.dlType)) return false;
    if (state.dlCType && !j.companyType.includes(state.dlCType)) return false;
    if (state.dlLinkOnly && !j.applyLink) return false;
    if (state.dlDeadline) {
      const d = daysUntil(j.deadline);
      if (d === null) return false;
      switch (state.dlDeadline) {
        case "today": return d === 0;
        case "3d": return d >= 0 && d <= 3;
        case "7d": return d >= 0 && d <= 7;
        case "21d": return d >= 0 && d <= 21;
        case "30d": return d >= 0 && d <= 30;
      }
    }
    return true;
  });
  // 按截止紧迫度排序：最近截止在前
  jobs.sort((a, b) => {
    const da = parseDeadline(a.deadline), db = parseDeadline(b.deadline);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da.getTime() - db.getTime();
  });
  return jobs;
}

function renderDeadline(reset) {

function initFilters() {
  const cities = new Set(), edus = new Set(), types = new Set(), dates = new Set(), ctypes = new Set();
  JOBS_DATA.forEach(j => {
    if (j.city) j.city.split(/[、,，]/).forEach(c => { c=c.trim(); if(c) cities.add(c); });
    if (j.education) edus.add(j.education);
    if (j.recruitType) types.add(j.recruitType);
    if (j.companyType) ctypes.add(j.companyType);
    if (j.updateDate) dates.add(j.updateDate);
  });
  const fillSelect = (id, set) => {
    const el = document.getElementById(id);
    const head = el.options.length ? el.options[0].outerHTML : '<option value="">全部</option>';
    const prev = el.value;    // 重建后还原用户已选项（分片加载完会再调一次）
    el.innerHTML = head;      // 幂等：避免选项重复堆积
    [...set].sort().forEach(v => {
      const o = document.createElement("option"); o.value=v; o.textContent=v; el.appendChild(o);
    });
    if (prev && [...el.options].some(o => o.value === prev)) el.value = prev;
  };
  fillSelect("filter-city", cities);
  fillSelect("filter-edu", edus);
  fillSelect("filter-type", types);
  fillSelect("filter-ctype", ctypes);
  fillSelect("fav-filter-city", cities);
  fillSelect("fav-filter-edu", edus);
  fillSelect("fav-filter-type", types);
  fillSelect("dl-filter-city", cities);
  fillSelect("dl-filter-edu", edus);
  fillSelect("dl-filter-type", types);
  fillSelect("dl-filter-ctype", ctypes);
  const dateFill = (id) => {
    const el = document.getElementById(id);
    const head = el.options.length ? el.options[0].outerHTML : '<option value="">全部</option>';
    const prev = el.value;
    el.innerHTML = head;      // 同上，幂等
    [...dates].sort((a,b) => b.localeCompare(a)).forEach(v => {
      const o = document.createElement("option"); o.value=v; o.textContent=v; el.appendChild(o);
    });
    if (prev && [...el.options].some(o => o.value === prev)) el.value = prev;
  };

// ── 简历管理（IndexedDB）──
let db;
function openDB() {
  return new Promise((resolve,reject) => {
    const req = indexedDB.open("resume_db", 1);
    req.onupgradeneeded = e => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("resumes")) {
        db.createObjectStore("resumes", {keyPath:"id", autoIncrement:true});
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

async function saveResume(file) {
  const tx = db.transaction("resumes","readwrite");
  const store = tx.objectStore("resumes");
  const now = new Date();
  const name = file.name.replace(/\.[^.]+$/,"");
  const ext = (file.name.match(/\.([^.]+)$/) || [,])[1] || "";
  store.add({
    name: name,
    filename: file.name,
    ext: ext,
    type: file.type,
    size: file.size,
    blob: file,
    date: now.toLocaleString("zh-CN")
  });
  tx.oncomplete = () => renderResumes();
}

async function renderResumes() {
  const tx = db.transaction("resumes","readonly");
  const store = tx.objectStore("resumes");
  const req = store.getAll();
  req.onsuccess = () => {
    const list = document.getElementById("resume-list");
    const resumes = req.result.sort((a,b) => b.id - a.id);
    if (resumes.length === 0) {
      list.innerHTML = `<div class="text-center text-gray-400 py-8">还没有上传简历</div>`;
      return;
    }
    list.innerHTML = resumes.map(r => {
      const sizeKB = (r.size/1024).toFixed(0);
      const sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+"MB" : sizeKB+"KB";
      const icon = r.ext === "pdf" ? "📕" : (r.ext.match(/docx?/)) ? "📘" : (r.ext.match(/jpe?g|png/)) ? "🖼️" : "📄";
      return `
      <div class="bg-white rounded-xl p-4 border border-gray-100 flex items-center gap-3">
        <span class="text-2xl">${icon}</span>
        <div class="flex-1 min-w-0">
          <div class="font-medium text-gray-800 text-sm truncate">${r.name}<span class="text-gray-400 font-normal">.${r.ext}</span></div>
          <div class="text-xs text-gray-400">${sizeStr} · ${r.date}</div>
        </div>
        <button class="btn-action bg-indigo-100 text-indigo-700 hover:bg-indigo-200" onclick="downloadResume(${r.id})">下载</button>
        <button class="btn-action bg-gray-100 text-gray-500 hover:bg-red-50 hover:text-red-600" onclick="deleteResume(${r.id})">删除</button>
      </div>`;
    }).join("");
  };
}

async function downloadResume(id) {
  const tx = db.transaction("resumes","readonly");
  const store = tx.objectStore("resumes");
  const req = store.get(id);
  req.onsuccess = () => {
    const r = req.result; if (!r) return;
    const url = URL.createObjectURL(r.blob);
    const a = document.createElement("a");
    a.href = url; a.download = r.filename; a.click();
    URL.revokeObjectURL(url);
  };
}

async function deleteResume(id) {
  const tx = db.transaction("resumes","readwrite");
  tx.objectStore("resumes").delete(id);
  tx.oncomplete = () => renderResumes();
}

// ── 数据加载（外置分片 + 本机缓存 + 多源竞速）──
const IDB_NAME = "jobs_cache_db", IDB_STORE = "shards";

function idbOpen() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(IDB_NAME, 1); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("idb open failed"));
  });
}
// 本机缓存命中 → 秒开，且断网也能用；数据版本变了自动失效重拉
async function cacheRead() {
  try {
    const db = await idbOpen();
    const rec = await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const r = tx.objectStore(IDB_STORE).get("data");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    if (rec && rec.ver === DATA_VER && rec.shards && rec.shards.length) return rec.shards;
  } catch (e) { console.warn("本机缓存读取失败:", e && e.message); }
  return null;
}
async function cacheWrite(shards) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put({ ver: DATA_VER, shards: shards }, "data");
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error || new Error("idb write failed"));
    });
    return true;
  } catch (e) { console.warn("本机缓存写入失败:", e && e.message); return false; }
}
function hideLoading() {
  const el = document.getElementById("data-loading");
  if (el) { el.style.opacity = "0"; el.style.transition = "opacity .25s"; setTimeout(() => el.remove(), 260); }
}
function setLoadProgress(pct, text) {
  const bar = document.getElementById("data-loading-bar");
  const txt = document.getElementById("data-loading-text");
  if (bar) bar.style.width = Math.max(6, Math.min(100, pct)) + "%";
  if (txt && text) txt.textContent = text;
}
// 全过程超时：超时覆盖到响应体读完为止（旧版只保护到响应头，源一挂起就永久卡死）
async function fetchJSON(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    return JSON.parse(txt);
  } finally {
    clearTimeout(timer);
  }
}
// 多源竞速：同时发起，谁先返回合法结果用谁（旧版串行试错，卡一个源就卡死全程）
function raceJSON(path, ms) {
  return new Promise((resolve, reject) => {
    let done = false, left = DATA_SOURCES.length, lastErr = null;
    DATA_SOURCES.forEach((base, i) => {
      setTimeout(() => {
        if (done) return;
        fetchJSON(base + path + "?v=" + DATA_VER, ms).then(v => {
          if (!done) { done = true; resolve({ base: base, val: v }); }
        }).catch(e => {
          lastErr = e; left -= 1;
          if (!done && left <= 0) reject(lastErr || new Error("all sources failed: " + path));
        });
      }, i === 0 ? 0 : 1200);   // 备用源延后 1.2s 起跑，不抢首选源带宽
    });
  });
}
// 取索引并校验版本（CDN 可能返回旧数据，ver 不符即弃用）
async function pickSource() {
  try {
    const r = await raceJSON("index.json", 12000);
    const idx = r.val;
    if (idx && idx.ver === DATA_VER && idx.files && idx.files.length) return { base: r.base, idx: idx };
    console.warn("数据版本不符，弃用源:", r.base, idx && idx.ver);
  } catch (e) {
    console.warn("索引获取失败:", e && e.message);
  }
  return null;
}

// 取单个分片（首选已验证的源，失败自动切备用源）
async function fetchShard(name) {
  const bases = ACTIVE_SOURCE
    ? [ACTIVE_SOURCE, ...DATA_SOURCES.filter(b => b !== ACTIVE_SOURCE)]
    : DATA_SOURCES;
  return new Promise((resolve, reject) => {
    let done = false, left = bases.length, lastErr = null;
    bases.forEach((base, i) => {
      setTimeout(() => {
        if (done) return;
        fetchJSON(base + name + "?v=" + DATA_VER, 20000).then(arr => {
          if (!done) { done = true; resolve(arr); }
        }).catch(e => {
          lastErr = e; left -= 1;
          if (!done && left <= 0) reject(lastErr || new Error("all sources failed: " + name));
        });
      }, i === 0 ? 0 : 2500);
    });
  });
}

// 精简数据还原（positionsText 由 positions 推导；pc 为精简后的分类映射）
function hydrate(list) {
  for (const j of list) {
    if (j.positionsText === undefined) j.positionsText = (j.positions || []).join("、");
  }
  return list;
}

// 后台分片并入后的重绘：传 false 保持"已看条数"，避免列表被打回 30 条、滚动位置跳动
function rerenderCurrent() {
  if (state.section === "jobs") renderJobs(false);
  else if (state.section === "deadline") renderDeadline(false);
  else if (state.section === "fav") renderFav();
  else if (state.section === "summary") renderSummary();
}

// 加载首片：完成即可交互，不等全量
async function loadJobsData() {
  if (JOBS_DATA.length > 0) return;  // 本地内嵌版无需加载
  if (location.protocol === "file:") {
    setLoadProgress(100, "本地文件无法加载外置数据，请使用线上版本");
    throw new Error("file protocol");
  }
  try {
    setLoadProgress(15, "正在读取本机缓存…");
    const cached = await cacheRead();
    if (cached) {
      JOBS_DATA = hydrate([].concat.apply([], cached));
      buildJobMap();
      setLoadProgress(100, "已从本机缓存恢复");
      checkDataUpdate();     // 后台核对是否有新数据，不阻塞
      return;
    }
    setLoadProgress(25, "正在连接数据源…");
    const picked = await pickSource();
    if (!picked) throw new Error("所有数据源均不可用");
    ACTIVE_SOURCE = picked.base;
    const idx = picked.idx;
    setLoadProgress(45, "正在加载岗位数据…");
    const first = hydrate(await fetchShard(idx.files[0]));
    JOBS_DATA = first;
    buildJobMap();
    dataProgress = { loaded: first.length, total: idx.total, files: idx.files, next: 1, shards: [first] };
    setLoadProgress(100, "加载完成");
  } catch (e) {
    setLoadProgress(100, "岗位数据加载失败，请检查网络后刷新重试");
    console.error("loadJobsData failed:", e);
    throw e;
  }
}

// 后台续传剩余分片，逐片并入列表；全部到位后写入本机缓存
async function loadRemainingShards() {
  const p = dataProgress;
  if (!p) return;
  while (p.next < p.files.length) {
    const name = p.files[p.next];
    try {
      const sh = hydrate(await fetchShard(name));
      p.shards.push(sh);
      JOBS_DATA = JOBS_DATA.concat(sh);
      buildJobMap();
      p.next += 1;
      p.loaded = JOBS_DATA.length;
      updateCounts();
      rerenderCurrent();
    } catch (e) {
      console.warn("后台分片加载中断:", name, e && e.message);
      return;   // 静默失败，保留已加载部分
    }
  }
  if (p.shards.length === p.files.length) await cacheWrite(p.shards);
  dataProgress = null;   // 全部就绪
  initFilters();
  updateCounts();
  rerenderCurrent();
}

// 缓存命中时的静默更新：只拉一次小索引，版本变了才全量重拉
async function checkDataUpdate() {
  try {
    const r = await raceJSON("index.json", 12000);
    const idx = r.val;
    if (!idx || idx.ver === DATA_VER || !idx.files || !idx.files.length) return;
    ACTIVE_SOURCE = r.base;
    const out = [];
    for (const name of idx.files) out.push(hydrate(await fetchShard(name)));
    JOBS_DATA = [].concat.apply([], out);
    buildJobMap();
    await cacheWrite(out);
    initFilters();
    updateCounts();
    rerenderCurrent();
  } catch (e) {
    console.warn("后台更新未完成，继续使用缓存:", e && e.message);
  }
}

// ── 初始化 ──
async function init() {
  loadStatuses();
  let dataOk = true;
  try { await loadJobsData(); } catch (e) { dataOk = false; }
  if (dataOk) {
    hideLoading();          // 首片就绪即可进入页面，不等全量
    loadRemainingShards();  // 后台续传剩余分片，不阻塞
  }
  await cloudLoad();
  // 每60秒拉一次云端，多设备同时在线也能同步
  setInterval(() => { if (syncStatus !== "syncing" && syncStatus !== "error") cloudLoad(); }, 60000);
  initFilters();
  refreshFavFilter();
  updateCounts();
  if (state.section === "deadline") renderDeadline(); else renderJobs();

  document.querySelectorAll(".nav-btn").forEach(b => {
    b.addEventListener("click", () => switchSection(b.dataset.section));
  });
  // 岗位分类
  document.querySelectorAll("#section-jobs .cat-tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll("#section-jobs .cat-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      state.cat = t.dataset.cat;
      state.page = 1;
      renderJobs();
    });
  });
  // 心选公司分类
  document.querySelectorAll(".fav-cat-tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".fav-cat-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      state.favCat = t.dataset.fcat;
      renderFav();
      updateCounts();
    });
  });
  // 岗位推荐筛选
  document.getElementById("search-input").addEventListener("input", e => {
    state.search = e.target.value.trim(); state.page = 1; renderJobs();
  });
  document.getElementById("filter-city").addEventListener("change", e => { state.city=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-edu").addEventListener("change", e => { state.edu=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-type").addEventListener("change", e => { state.rtype=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-ctype").addEventListener("change", e => { state.ctype=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-opened").addEventListener("change", e => { state.openedWithin=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-date").addEventListener("change", e => { state.updateDate=e.target.value; state.page=1; renderJobs(); });
  document.getElementById("filter-link").addEventListener("change", e => { state.linkOnly=e.target.checked; state.page=1; renderJobs(); });
  // 心选公司筛选
  document.getElementById("fav-search-input").addEventListener("input", e => {
    state.favSearch = e.target.value.trim(); renderFav();
  });
  document.getElementById("fav-filter-city").addEventListener("change", e => { state.favCity=e.target.value; renderFav(); });
  document.getElementById("fav-filter-edu").addEventListener("change", e => { state.favEdu=e.target.value; renderFav(); });
  document.getElementById("fav-filter-type").addEventListener("change", e => { state.favType=e.target.value; renderFav(); });
  document.getElementById("fav-filter-date").addEventListener("change", e => { state.favDate=e.target.value; renderFav(); });
  document.getElementById("filter-fav").addEventListener("change", e => { state.favFilter=e.target.value; renderFav(); });
  document.getElementById("fav-filter-link").addEventListener("change", e => { state.favLinkOnly=e.target.checked; renderFav(); });
  // 汇总筛选
  document.getElementById("sum-filter-date").addEventListener("change", e => { state.sumDate=e.target.value; renderSummary(); });
  document.querySelectorAll(".status-tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".status-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      state.sumStatus = t.dataset.status;
      renderSummary();
    });
  });
  // 倒计时筛选
  document.getElementById("dl-search-input").addEventListener("input", e => {
    state.dlSearch = e.target.value.trim(); state.dlPage = 1; renderDeadline();
  });
  document.getElementById("dl-filter-city").addEventListener("change", e => { state.dlCity=e.target.value; state.dlPage=1; renderDeadline(); });
  document.getElementById("dl-filter-edu").addEventListener("change", e => { state.dlEdu=e.target.value; state.dlPage=1; renderDeadline(); });
  document.getElementById("dl-filter-type").addEventListener("change", e => { state.dlType=e.target.value; state.dlPage=1; renderDeadline(); });
  document.getElementById("dl-filter-ctype").addEventListener("change", e => { state.dlCType=e.target.value; state.dlPage=1; renderDeadline(); });
  document.getElementById("dl-filter-deadline").addEventListener("change", e => { state.dlDeadline=e.target.value; state.dlPage=1; renderDeadline(); });
  document.getElementById("dl-filter-link").addEventListener("change", e => { state.dlLinkOnly=e.target.checked; state.dlPage=1; renderDeadline(); });
  // 弹窗
  document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  // 简历上传
  const dz = document.getElementById("drop-zone");
  const fi = document.getElementById("file-input");
  fi.addEventListener("change", e => { if (e.target.files[0]) saveResume(e.target.files[0]); fi.value=""; });
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
  dz.addEventListener("drop", e => {
    e.preventDefault(); dz.classList.remove("dragover");
    if (e.dataTransfer.files[0]) saveResume(e.dataTransfer.files[0]);
  });
  // 导入文件
  document.getElementById("import-file").addEventListener("change", e => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  });
  // IndexedDB
  openDB().then(() => { if (state.section === "resume") renderResumes(); });
}

init();
</script>
</body>
</html>
